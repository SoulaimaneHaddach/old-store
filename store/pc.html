<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse PC hardware at LensMasters." />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="camera.css" />
    <link rel="icon" href="assets/images/icon.png" type="image/x-icon" />
    <script src="java.js" defer></script>
    <title>LensMasters | PC</title>
  </head>
  <body>
    <header>
      <a href="home.html" class="logo">LensMasters</a>
      <nav class="navg">
        <a href="home.html"><i class="fa-solid fa-house"></i> Home</a>
        <a href="camera.html"><i class="fa-solid fa-camera"></i> Cameras</a>
        <a href="laptops.html"><i class="fa-solid fa-laptop"></i> Laptops</a>
        <a href="drone.html"><i class="fa-solid fa-helicopter"></i> Drones</a>
        <a href="pc.html"><i class="fa-solid fa-desktop"></i> PC</a>
        <a href="memberlist.html"><i class="fa-solid fa-bars-staggered"></i> Members</a>
      </nav>
    </header>
    <h1 class="f">PC collection</h1>
    <div class="category-nav" aria-label="Product categories">
      <a class="category-chip is-active" href="pc.html" data-category-filter="all">All</a>
      <a class="category-chip" href="camera.html" data-category-filter="camera">Camera</a>
      <a class="category-chip" href="laptops.html" data-category-filter="laptops">Laptops</a>
      <a class="category-chip" href="drone.html" data-category-filter="drone">Drone</a>
      <a class="category-chip" href="pc.html" data-category-filter="pc">PC</a>
    </div>
    <div class="catalog-toolbar" aria-label="Catalog controls">
      <div class="toolbar-field">
        <label for="pc-search">Search</label>
        <input id="pc-search" type="search" data-product-search placeholder="Search PCs" />
      </div>
      <div class="toolbar-field">
        <label for="pc-sort">Sort by</label>
        <select id="pc-sort" data-sort>
          <option value="featured">Featured</option>
          <option value="price-low">Price: low to high</option>
          <option value="price-high">Price: high to low</option>
          <option value="name">Name</option>
        </select>
      </div>
    </div>
    <main class="sec">
      <div class="products">
        <article class="card">
          <div class="img">
            <img src="assets/images/laptops/I5 11400H.png" alt="Gaming PC" />
          </div>
          <div class="desc">Gaming</div>
          <h2 class="title">Starter gaming PC</h2>
          <div class="box">
            <span class="price">$899</span
            ><a class="btn" href="laptops.html">View gear</a>
          </div>
        </article>
        <article class="card">
          <div class="img">
            <img
              src="assets/images/laptops/I7 12700H.png"
              alt="Creator workstation" />
          </div>
          <div class="desc">Creator</div>
          <h2 class="title">Creator workstation</h2>
          <div class="box">
            <span class="price">$1,299</span
            ><a class="btn" href="laptops.html">View gear</a>
          </div>
        </article>
        <article class="card">
          <div class="img">
            <img
              src="assets/images/laptops/i7 12th.png"
              alt="Performance desktop PC" />
          </div>
          <div class="desc">Performance</div>
          <h2 class="title">Performance desktop PC</h2>
          <div class="box">
            <span class="price">$1,499</span
            ><a class="btn" href="laptops.html">View gear</a>
          </div>
        </article>
      </div>
    </main>
    <p class="no-results" aria-live="polite">No PC models match your search.</p>
    <footer class="footer">
      <span>© 2026 LensMasters</span><a href="home.html">Home</a>
    </footer>
  </body>
</html>
